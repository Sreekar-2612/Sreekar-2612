<svg width="100%" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plus Jakarta Sans", "Helvetica Neue", sans-serif; font-weight: 800; fill: #0B2545; letter-spacing: -0.03em; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 600; fill: #134074; letter-spacing: -0.01em; }
      .txt-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; fill: #1D4E89; letter-spacing: 0.12em; font-weight: 600; }
      .txt-quote { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-style: italic; font-weight: 500; fill: #0B2545; font-size: 14px; }
      .badge-bg { fill: #FFFFFF; opacity: 0.85; rx: 16px; }
    </style>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="50%" stop-color="#C2E2FA"/>
      <stop offset="100%" stop-color="#9FD3F7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#skyGrad)" rx="16"/>
  <rect width="1200" height="360" fill="none" stroke="#89C2EC" stroke-width="2" rx="16"/>

  <!-- Aesthetic Grid and Geometric Waves -->
  <circle cx="1080" cy="180" r="160" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="1080" cy="180" r="110" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="1080" cy="180" r="60" fill="#0284C7" fill-opacity="0.15"/>
  <line x1="80" y1="52" x2="1120" y2="52" stroke="#89C2EC" stroke-width="1"/>
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#89C2EC" stroke-width="1"/>

  <!-- Header Coordinates -->
  <g transform="translate(80, 36)">
    <text x="0" y="0" class="txt-mono">SYSTEM SPEC // AI · GENAI · DEVELOPMENT</text>
    <text x="460" y="0" class="txt-mono">LOCATION // HYDERABAD &amp; CHENNAI, IN</text>
    <text x="1040" y="0" class="txt-mono" text-anchor="end" fill="#0284C7">STATUS // BUILDING CONSISTENTLY</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="145" class="txt-title" font-size="76">SREEKAR</text>
  
  <!-- Engineering Descriptor -->
  <text x="84" y="190" class="txt-sub" font-size="22">
    Artificial Intelligence <tspan fill="#0284C7">·</tspan> Generative AI <tspan fill="#0284C7">·</tspan> Software Engineering
  </text>

  <!-- Chill / Consistent Work Ethic Pill -->
  <g transform="translate(84, 218)">
    <rect width="490" height="34" rx="17" fill="url(#cardGrad)" stroke="#89C2EC" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#0284C7"/>
    <text x="32" y="22" class="txt-quote">"Slow is smooth, smooth is fast. Consistency over intensity."</text>
  </g>

  <!-- Secondary Meta Badges -->
  <g transform="translate(84, 320)">
    <text x="0" y="0" class="txt-mono" font-size="12">01 / DEEP LEARNING &amp; VISION</text>
    <text x="280" y="0" class="txt-mono" font-size="12">02 / RAG &amp; AGENT ORCHESTRATION</text>
    <text x="600" y="0" class="txt-mono" font-size="12">03 / FULL-STACK PLATFORMS</text>
    <text x="880" y="0" class="txt-mono" font-size="12">04 / SYSTEMS COMPUTING</text>
  </g>
</svg>
