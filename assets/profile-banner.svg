<svg width="100%" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .swiss-bg { fill: #F7F7F4; }
      .grid-line { stroke: #DADBD6; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.6; }
      .solid-grid { stroke: #E4E5E0; stroke-width: 1; }
      .accent-blue { stroke: #315EFB; stroke-width: 2.5; stroke-linecap: square; }
      .accent-blue-fill { fill: #315EFB; }
      .charcoal-primary { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Arial", sans-serif; font-weight: 700; }
      .charcoal-secondary { fill: #3C4043; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Arial", sans-serif; font-weight: 500; }
      .swiss-mono { font-family: "JetBrains Mono", "SF Mono", "Consolas", monospace; font-size: 11px; fill: #5F6368; letter-spacing: 0.12em; font-weight: 500; }
      .swiss-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #315EFB; font-weight: 600; letter-spacing: 0.08em; }
    </style>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFBF9"/>
      <stop offset="100%" stop-color="#F3F3EF"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#warmGrad)"/>
  <rect width="1200" height="380" fill="none" stroke="#DADBD6" stroke-width="1.5"/>

  <!-- Swiss Architectural Grid Lines -->
  <!-- Vertical columns -->
  <line x1="80" y1="0" x2="80" y2="380" class="solid-grid"/>
  <line x1="360" y1="0" x2="360" y2="380" class="grid-line"/>
  <line x1="640" y1="0" x2="640" y2="380" class="grid-line"/>
  <line x1="920" y1="0" x2="920" y2="380" class="solid-grid"/>
  <line x1="1120" y1="0" x2="1120" y2="380" class="solid-grid"/>

  <!-- Horizontal baselines -->
  <line x1="0" y1="60" x2="1200" y2="60" class="solid-grid"/>
  <line x1="0" y1="290" x2="1200" y2="290" class="solid-grid"/>

  <!-- Abstract Geometric Balance Composition (Top Right) -->
  <g transform="translate(940, 75)">
    <!-- Concentric minimalist arcs -->
    <path d="M 0 140 A 140 140 0 0 1 140 0" fill="none" stroke="#DADBD6" stroke-width="1.5"/>
    <path d="M 40 140 A 100 100 0 0 1 140 40" fill="none" stroke="#315EFB" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Modernist block elements -->
    <rect x="70" y="80" width="70" height="60" fill="#202124" opacity="0.04"/>
    <circle cx="140" cy="140" r="4" fill="#315EFB"/>
    <circle cx="0" cy="140" r="3" fill="#202124"/>
    <line x1="30" y1="140" x2="140" y2="140" stroke="#315EFB" stroke-width="1.5"/>
    <!-- Technical registration crosshair -->
    <g transform="translate(130, 20)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#315EFB" stroke-width="1.5"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#315EFB" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Technical Index Markers (Top Grid) -->
  <g transform="translate(80, 42)">
    <text x="0" y="0" class="swiss-mono">SEC. 01 // PROFILE SPECIFICATION</text>
    <text x="280" y="0" class="swiss-mono">LOC // HYDERABAD, IN</text>
    <text x="560" y="0" class="swiss-tag">SYS // PRODUCTION &amp; RESEARCH GRADE</text>
    <text x="840" y="0" class="swiss-mono" text-anchor="start">ID // SREEKAR-2612</text>
  </g>

  <!-- Cobalt Blue Dynamic Accent Beam -->
  <line x1="80" y1="60" x2="260" y2="60" class="accent-blue"/>
  <circle cx="260" cy="60" r="3" class="accent-blue-fill"/>

  <!-- Primary Headline Typography (Swiss Bold) -->
  <text x="76" y="165" class="charcoal-primary" font-size="78" letter-spacing="-0.035em">SREEKAR</text>

  <!-- Engineering Descriptor -->
  <text x="80" y="215" class="charcoal-secondary" font-size="22" letter-spacing="-0.015em">
    Software Engineering <tspan fill="#315EFB" font-weight="600">/</tspan> Generative AI <tspan fill="#315EFB" font-weight="600">/</tspan> Machine Learning
  </text>

  <!-- Secondary Context Line -->
  <text x="80" y="250" class="swiss-mono" font-size="12">
    ARCHITECTING INTELLIGENT RETRIEVAL PIPELINES, DEEP LEARNING SYSTEMS &amp; LOW-LEVEL ARCHITECTURES
  </text>

  <!-- Bottom Metadata Row (Swiss 4-Column Grid) -->
  <g transform="translate(80, 332)">
    <!-- Col 1 -->
    <text x="0" y="0" class="swiss-mono">01 / GENAI &amp; AGENTS</text>
    <text x="0" y="20" class="charcoal-secondary" font-size="13" font-weight="600">LangChain · RAG · Hugging Face · Groq</text>

    <!-- Col 2 -->
    <text x="280" y="0" class="swiss-mono">02 / DEEP LEARNING</text>
    <text x="280" y="20" class="charcoal-secondary" font-size="13" font-weight="600">PyTorch · Vision Transformers · Geospatial AI</text>

    <!-- Col 3 -->
    <text x="560" y="0" class="swiss-mono">03 / SYSTEMS COMPUTING</text>
    <text x="560" y="20" class="charcoal-secondary" font-size="13" font-weight="600">xv6 OS · C / C++ · CXL/PIM Sim · Distributed</text>

    <!-- Col 4 -->
    <text x="840" y="0" class="swiss-mono">04 / FULL-STACK PLATFORMS</text>
    <text x="840" y="20" class="charcoal-secondary" font-size="13" font-weight="600">React 19 · TypeScript · FastAPI · Supabase</text>
  </g>

  <!-- Bottom Accent Anchor -->
  <line x1="80" y1="290" x2="160" y2="290" stroke="#202124" stroke-width="2"/>
  <rect x="1115" y="285" width="10" height="10" fill="#315EFB"/>
</svg>
